# Waterfall build: data/*.json → content/*.md (front matter) → recipes/*.html + themes/*/preview.html → index.html
# Runs on every push to main (sync commits from the assistant, human/agent edits of Markdown or themes, …).
# Makes at most ONE commit "build: json → md → html [skip ci]", and only when an output changed.
# Loop guard: the job skips pushes by github-actions[bot]; the commit also carries [skip ci]; and pushes made with
# GITHUB_TOKEN never start new workflow runs anyway.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the generated files
  pages: write      # ask GitHub Pages to rebuild after the bot commit

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (the only dependency of the build)
        run: pip install pyyaml
      - name: 1 · JSON → Markdown front matter
        run: python3 tools/apply_json.py
      - name: 2 · Markdown + theme → HTML
        run: python3 tools/build.py
      - name: 3 · Index
        run: python3 tools/build_index.py
      - name: Commit generated files (only if something changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content recipes index.html themes
          if git diff --cached --quiet; then
            echo "Nothing to build — outputs already up to date."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --cached --stat
          git commit -q -m "build: json → md → html [skip ci]" -m "Generated by .github/workflows/build.yml from ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && { echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "push rejected/failed (attempt $i) — rebasing and retrying"; sleep $((i*3))
            git pull -q --rebase origin main
          done
          exit 1
      - name: Request a GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Pages rebuild request failed — the next push will publish it"
